services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: openshield-app
    ports:
      - "3001:3000"
    environment:
      # ALL secrets below MUST be set in .env (never commit .env).
      # See .env.example for required variables and how to generate them.
      NODE_ENV: production
      APP_VERSION: "0.1.0"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      POSTGRES_USER: ${POSTGRES_USER:-openshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-openshield}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set in .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3001}
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
      LOGIN_RATE_LIMIT: "${LOGIN_RATE_LIMIT:-5}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      DATABASE_URL: postgresql://${POSTGRES_USER:-openshield}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-openshield}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Poller
      INGEST_HMAC_SECRET: ${INGEST_HMAC_SECRET:?INGEST_HMAC_SECRET must be set in .env}
      POLLER_INTERVAL_SECONDS: "${POLLER_INTERVAL_SECONDS:-30}"
      POLLER_ENABLED: "${POLLER_ENABLED:-true}"
      OPENSHIELD_BASE_URL: "http://127.0.0.1:3000"
      OPENSHIELD_PUBLIC_URL: ${OPENSHIELD_PUBLIC_URL:-http://localhost:3001}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    container_name: openshield-postgres
    ports:
      # Expose publicly for Navicat / pgAdmin access.
      # Bind to all interfaces (0.0.0.0) so external clients can connect via
      # the host's IP. pg_hba.conf inside container still requires password
      # auth — see init/02-pg_hba_remote.sh for the allow rule.
      # SECURITY: For production, restrict to specific IPs via firewall
      # (ufw allow from <trusted-ip> to any port 5433) instead of 0.0.0.0.
      - "0.0.0.0:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-openshield}
      # Listen on all interfaces (default is localhost-only)
      POSTGRES_INITDB_ARGS: ""
    command:
      - "postgres"
      - "-c"
      - "listen_addresses=*"
      - "-c"
      - "port=5432"
    volumes:
      - openshield-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openshield -d openshield"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: openshield-redis
    ports:
      - "127.0.0.1:6380:6379"
    command:
      - sh
      - -c
      - |
        printf 'requirepass %s\n' "$$REDIS_PASSWORD" >> /etc/redis.conf
        cat /etc/redis.conf
        redis-server /etc/redis.conf --appendonly yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    volumes:
      - openshield-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  openshield-postgres-data:
    name: openshield_openshield-postgres-data
  openshield-redis-data:
    name: openshield_openshield-redis-data
