# OpenShield Python Agent — Configuration Example
# ──────────────────────────────────────────────────────────────
# Save as /etc/openshield/agent.yaml and replace placeholders with
# values from OpenShield UI → Settings → Agents → Add Agent.

server_url: "http://YOUR-OPENSHIELD-SERVER:3001"
agent_id: "PASTE-AGENT-ID-FROM-UI"
secret_token: "PASTE-SECRET-TOKEN-FROM-UI"

agent_name: "my-server-agent"

# ─── Heartbeat ────────────────────────────────────────
heartbeat_interval: 30        # seconds between heartbeats
event_batch_size: 100         # max events per heartbeat

# ─── File Integrity Monitoring ────────────────────────
# Watch these paths for SHA-256 hash changes (alerts on modification)
fim_paths:
  - /etc/passwd
  - /etc/shadow
  - /etc/group
  - /etc/sudoers
  - /etc/ssh/sshd_config
  - /etc/crontab

# ─── Process Watchlist ───────────────────────────────
# Regex patterns for suspicious processes (default: web→shell, miners, reverse shells)
process_watchlist:
  - '^(www-data|nginx|apache|httpd|www) .* (/bin/(ba)?sh|/bin/dash)$'
  - '(xmrig|cryptonight|minerd|stratum\+tcp)'
  - '(nc|ncat|netcat)\s.*(-e\s|/bin/(ba)?sh)'

# ─── Paths (optional overrides) ──────────────────────
state_dir: /var/lib/openshield
log_dir: /var/log/openshield
log_file: /var/log/openshield/agent.log

# ─── Log Watchers (file tailing) ────────────────────
# Agent tails these files and emits events via the matching parser.
# Path differs per distro:
#   - Debian/Ubuntu: /var/log/syslog (rsyslog default)
#   - RHEL/CentOS 7+: /var/log/messages (rsyslog default)
#   - Alpine:        /var/log/messages
# Edit the path if your distro uses a different location.
log_watchers:
  # SSH authentication (always required — feeds Server Auth page)
  - path: /var/log/auth.log
    parser: sshd
  # On RHEL/CentOS the auth log is at /var/log/secure (uncomment if needed)
  # - path: /var/log/secure
  #   parser: sshd

  # General system log (feeds Syslog page)
  # Uses SyslogParser which filters noisy processes (kernel, cron, systemd)
  # and infers severity from message keywords (error, fail, warn, panic, …).
  - path: /var/log/syslog
    parser: syslog
  # RHEL/CentOS uses /var/log/messages instead — swap if deploying there
  # - path: /var/log/messages
  #   parser: syslog

  # MySQL audit (optional — uncomment if you set log_output=FILE on target)
  # - path: /var/log/mysql/mysql.log
  #   parser: mysql_audit

  # PostgreSQL audit (optional — uncomment if you enabled pgaudit)
  # - path: /var/log/postgresql/postgresql-*-main.log
  #   parser: pgaudit
